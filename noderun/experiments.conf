# experiments.conf
# 最终格式:[实验名] [剪枝率] [停止步数] [数据量] [轮数] [批大小] [Trainer类]
# 逻辑: 如果 Trainer类 是 "Trainer", 则为 PRUNING 实验。否则，为 DUMMY 实验。

# 实验组1: DUMMY 实验 (因为 Trainer类 不是 'Trainer')

llama8B-0.9-super  0.9 8000  1000000 4.0 4 Super2Trainer
# 实验组2: PRUNING 实验 (因为 Trainer类 正是 'Trainer')
# 将会调用 run_pruning.sh 脚本，并同步到 PRUNING 的工作目录。
llama8B-0.9-base1  0.9 8000  1000000 4.0 4 Trainer
llama8B-0.9-base2  0.9 16000  1000000 4.0 4 Trainer
